version: "3.5"

services:
  pulsar:
    image: apachepulsar/pulsar:3.0.2
    command: ["bin/pulsar", "standalone", "--no-functions-worker", "--no-stream-storage"]
    ports:
      - "6650:6650"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nodered:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: nodered-dev
    ports:
      - "1880:1880"
    volumes:
      - nodered-dev:/data
    depends_on:
      pulsar:
        condition: service_healthy

volumes:
  nodered-dev:
    name: nodered-dev
